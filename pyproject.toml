[build-system]
requires = ["setuptools>=40.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spar-cli"
version = "0.1.0"
requires-python = ">=3.11"
description = "CLI tool orchestrating debates between AI CLIs"
authors = [{name = "Marek Bartczak", email = "marek.bartczak@gmail.com"}]

[project.optional-dependencies]
dev = ["pytest", "pytest-qt"]
gui = ["PySide6>=6.6", "pygments>=2.17"]
package-macos = ["pyinstaller>=6.10,<7; sys_platform == 'darwin'"]

[project.scripts]
spar = "spar.cli:main"
# Desktop/terminal entry point for the gui (ADR 0007): `spar-gui [PATH]`,
# and `spar-gui --pick` for the .desktop launcher, which starts with no
# meaningful working directory and must ask for the project.
spar-gui = "spar.gui.launcher:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["spar*"]

[tool.setuptools.package-data]
# The app icon is loaded at runtime (spar.gui.app.app_icon) and installed by
# packaging/linux/install.sh, so it must ship in the wheel.
"spar.gui" = ["assets/*.svg"]

[tool.pytest.ini_options]
markers = [
    "contract: opt-in contract tests for real AI CLIs (set SPAR_CONTRACT_TESTS=1)",
]
